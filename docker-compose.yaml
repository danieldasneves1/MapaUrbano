
services:
  postgres:
    image: postgres:15-alpine
    container_name: banco
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mapaurbano
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: mapa-urbano
    ports:
      - "8080:8080"
    environment:
     - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mapaurbano
     - SPRING_DATASOURCE_USERNAME=postgres
     - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
     - GEOAPI_KEY=${GEOAPI_KEY}
     - JWT_KEY=${JWT_KEY}
    depends_on:
      postgres:
        condition: service_healthy