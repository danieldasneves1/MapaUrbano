version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: banco
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 140819d
      POSTGRES_DB: mapaurbano
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: mapa-urbano
    ports:
      - "8080:80"
    environment:
     - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nome_do_banco
     - SPRING_DATASOURCE_USERNAME=postgres
     - SPRING_DATASOURCE_PASSWORD=140819d
    depends_on:
      - postgres


  
