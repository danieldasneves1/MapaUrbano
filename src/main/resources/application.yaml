jwt:
  expiration: 86400000
  key: ${JWT_KEY}

spring:
  application:
    name: mapaurbano
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://postgres:5432/mapaurbano
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  logging:
    level:
      org:
        springframework:
          security: DEBUG

  geoapi:
    url: "https://api.geoapify.com/v1/geocode"
    keyapi: ${GEOAPI_KEY}